<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070912">

<title>StudyCore — Free Learning for Students</title>

<meta name="description"
content="StudyCore is a free learning platform for Indian students. Learn, practise, solve and test your understanding.">

<style>

/* =========================================================
   STUDYCORE
   ONE-FILE EDITION
   ========================================================= */

:root{
  --bg:#060811;
  --bg2:#0b0f1c;
  --panel:#101625;
  --panel2:#151c2d;
  --line:#252e43;

  --text:#f5f7ff;
  --muted:#929db2;

  --accent:#7887ff;
  --accent2:#45d6c3;

  --success:#55d98b;
  --danger:#ff7185;

  --radius:20px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  background:
    radial-gradient(
      circle at 80% -10%,
      rgba(92,111,255,.20),
      transparent 32%
    ),
    radial-gradient(
      circle at -10% 40%,
      rgba(69,214,195,.08),
      transparent 28%
    ),
    var(--bg);

  color:var(--text);

  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

  line-height:1.5;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}


/* =========================================================
   TOP BAR
   ========================================================= */

.topbar{

  position:sticky;
  top:0;
  z-index:100;

  height:72px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 22px;

  background:rgba(6,8,17,.84);

  backdrop-filter:blur(20px);

  border-bottom:
    1px solid rgba(255,255,255,.06);
}

.brand{

  display:flex;
  align-items:center;
  gap:12px;

  cursor:pointer;
}

.brand-mark{

  width:40px;
  height:40px;

  display:grid;
  place-items:center;

  border-radius:13px;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      var(--accent2)
    );

  color:#071019;

  font-weight:950;
  font-size:18px;

  box-shadow:
    0 8px 30px rgba(91,108,255,.20);
}

.brand-name{

  font-size:14px;
  font-weight:900;

  letter-spacing:.14em;
}

.brand-sub{

  color:var(--muted);

  font-size:10px;

  margin-top:1px;
}

.top-actions{

  display:flex;
  gap:8px;
}


/* =========================================================
   BUTTONS
   ========================================================= */

.btn{

  border:1px solid var(--line);

  background:var(--panel);

  color:var(--text);

  padding:10px 14px;

  border-radius:12px;

  transition:.18s ease;
}

.btn:hover{

  transform:translateY(-1px);

  border-color:#4b5c80;
}

.btn-primary{

  border:0;

  background:
    linear-gradient(
      135deg,
      var(--accent),
      #5969ec
    );

  color:white;

  font-weight:800;

  box-shadow:
    0 10px 28px rgba(91,108,255,.18);
}

.btn-primary:hover{

  transform:translateY(-2px);

  box-shadow:
    0 14px 35px rgba(91,108,255,.27);
}


/* =========================================================
   MAIN
   ========================================================= */

main{

  width:min(1120px,100%);

  margin:auto;

  padding:
    28px 20px
    90px;
}


/* =========================================================
   HERO
   ========================================================= */

.hero{

  padding:
    55px 0
    38px;
}

.hero-label{

  color:var(--accent2);

  font-size:11px;

  font-weight:900;

  letter-spacing:.18em;

  margin-bottom:14px;
}

.hero h1{

  max-width:850px;

  font-size:
    clamp(
      38px,
      7vw,
      72px
    );

  line-height:.98;

  letter-spacing:-.055em;

  margin-bottom:20px;
}

.hero p{

  max-width:720px;

  color:var(--muted);

  font-size:16px;

  line-height:1.75;
}


/* =========================================================
   PATH
   ========================================================= */

.path{

  display:flex;

  flex-wrap:wrap;

  align-items:center;

  gap:7px;

  color:#758198;

  font-size:12px;

  margin:
    5px 0
    22px;
}

.path strong{

  color:#cbd2df;
}

.path b{

  color:#4c5870;
}


/* =========================================================
   SECTION
   ========================================================= */

.section{

  margin-top:38px;
}

.section-heading{

  display:flex;

  justify-content:space-between;

  align-items:end;

  gap:20px;

  margin-bottom:15px;
}

.section-heading h2{

  font-size:24px;
}

.section-heading p{

  color:var(--muted);

  font-size:13px;
}


/* =========================================================
   CARDS
   ========================================================= */

.grid{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:12px;
}

.card{

  position:relative;

  min-height:130px;

  padding:21px;

  text-align:left;

  color:var(--text);

  background:
    linear-gradient(
      145deg,
      rgba(20,28,47,.96),
      rgba(13,18,31,.96)
    );

  border:
    1px solid var(--line);

  border-radius:var(--radius);

  transition:
    transform .18s ease,
    border-color .18s ease,
    box-shadow .18s ease;
}

.card:hover{

  transform:translateY(-3px);

  border-color:#485879;

  box-shadow:
    0 18px 45px rgba(0,0,0,.25);
}

.card-title{

  display:block;

  font-size:17px;

  font-weight:800;

  margin-bottom:7px;
}

.card-description{

  display:block;

  max-width:85%;

  color:var(--muted);

  font-size:13px;

  line-height:1.5;
}

.card-arrow{

  position:absolute;

  right:18px;
  bottom:17px;

  color:var(--accent2);

  font-size:18px;
}


/* =========================================================
   BACK
   ========================================================= */

.back{

  margin-bottom:16px;
}


/* =========================================================
   PANEL
   ========================================================= */

.panel{

  background:
    linear-gradient(
      145deg,
      rgba(17,24,41,.98),
      rgba(11,16,28,.98)
    );

  border:
    1px solid var(--line);

  border-radius:var(--radius);

  padding:23px;
}


/* =========================================================
   TOPIC
   ========================================================= */

.topic-header{

  margin-bottom:20px;
}

.topic-header h1{

  font-size:
    clamp(30px,5vw,48px);

  letter-spacing:-.035em;

  margin-bottom:7px;
}

.topic-header p{

  color:var(--muted);
}


/* =========================================================
   TABS
   ========================================================= */

.tabs{

  display:flex;

  gap:7px;

  overflow-x:auto;

  padding-bottom:5px;

  margin:
    20px 0;
}

.tab{

  flex:none;

  border:
    1px solid var(--line);

  background:transparent;

  color:var(--muted);

  padding:
    10px 13px;

  border-radius:12px;

  font-size:12px;

  font-weight:800;

  letter-spacing:.04em;
}

.tab.active{

  background:#f3f5ff;

  color:#080b13;

  border-color:#f3f5ff;
}


/* =========================================================
   CONTENT
   ========================================================= */

.content h2{

  font-size:25px;

  margin-bottom:13px;
}

.content h3{

  font-size:18px;

  margin:
    27px 0
    10px;
}

.content p{

  color:#c6cedd;

  line-height:1.8;

  margin-bottom:14px;
}

.content ul{

  padding-left:20px;

  color:#c6cedd;
}

.content li{

  margin-bottom:9px;

  line-height:1.7;
}


/* =========================================================
   FORMULA
   ========================================================= */

.formula{

  padding:17px;

  background:#080d18;

  border:
    1px solid #2d3952;

  border-radius:14px;

  color:#dfe7ff;

  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    monospace;

  overflow:auto;
}


/* =========================================================
   QUESTIONS
   ========================================================= */

.question{

  padding:19px;

  margin-bottom:12px;

  background:#0c1220;

  border:
    1px solid var(--line);

  border-radius:16px;
}

.question-number{

  color:var(--accent2);

  font-size:10px;

  font-weight:900;

  letter-spacing:.14em;
}

.question p{

  margin:
    8px 0
    12px;
}

details summary{

  cursor:pointer;

  color:#dfe5f3;

  font-weight:700;
}


/* =========================================================
   QUIZ
   ========================================================= */

.quiz-option{

  width:100%;

  padding:12px 14px;

  margin-top:8px;

  text-align:left;

  color:var(--text);

  background:#11192a;

  border:
    1px solid var(--line);

  border-radius:11px;

  transition:.15s;
}

.quiz-option:hover{

  border-color:#536483;

  background:#151f34;
}

.quiz-result{

  margin-top:12px;

  font-weight:800;
}

.correct{
  color:var(--success);
}

.incorrect{
  color:var(--danger);
}


/* =========================================================
   AI
   ========================================================= */

.ai-box{

  padding:23px;

  background:
    radial-gradient(
      circle at 100% 0,
      rgba(120,135,255,.15),
      transparent 40%
    ),
    #10182a;

  border:
    1px solid #35476f;

  border-radius:20px;
}

.ai-limit{

  color:var(--accent2);

  font-size:10px;

  font-weight:900;

  letter-spacing:.14em;

  margin-bottom:10px;
}

.ai-box textarea{

  width:100%;

  min-height:130px;

  resize:vertical;

  padding:14px;

  margin:
    13px 0;

  background:#080d18;

  color:var(--text);

  border:
    1px solid var(--line);

  border-radius:13px;

  outline:none;
}

.ai-box textarea:focus{

  border-color:var(--accent);
}

.ai-response{

  white-space:pre-wrap;

  color:#d5dcea;

  line-height:1.75;

  margin-top:16px;
}


/* =========================================================
   TOOLS
   ========================================================= */

.tool-grid{

  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:12px;
}

.tool{

  background:var(--panel);

  border:
    1px solid var(--line);

  border-radius:18px;

  padding:20px;
}

.tool h3{

  margin-bottom:5px;
}

.tool p{

  color:var(--muted);

  font-size:13px;

  margin-bottom:13px;
}

.tool input{

  width:100%;

  padding:12px;

  margin-bottom:8px;

  background:#080d18;

  color:white;

  border:
    1px solid var(--line);

  border-radius:10px;

  outline:none;
}

.tool input:focus{

  border-color:var(--accent);
}

.tool-output{

  margin-top:12px;

  color:var(--accent2);

  font-weight:850;
}


/* =========================================================
   SEARCH
   ========================================================= */

.search{

  width:100%;

  padding:14px 16px;

  background:#090e1b;

  color:white;

  border:
    1px solid var(--line);

  border-radius:14px;

  outline:none;

  margin-bottom:15px;
}


/* =========================================================
   NOTICE
   ========================================================= */

.notice{

  padding:14px 16px;

  margin:
    16px 0;

  background:#0c1525;

  border-left:
    3px solid var(--accent2);

  border-radius:9px;

  color:#c7cfdd;

  font-size:13px;
}


/* =========================================================
   FOOTER
   ========================================================= */

footer{

  padding:
    25px 18px;

  border-top:
    1px solid rgba(255,255,255,.06);

  text-align:center;

  color:#66728a;

  font-size:12px;
}


/* =========================================================
   MODAL
   ========================================================= */

.modal{

  position:fixed;

  inset:0;

  z-index:300;

  display:none;

  place-items:center;

  padding:20px;

  background:rgba(0,0,0,.70);

  backdrop-filter:blur(8px);
}

.modal.show{

  display:grid;
}

.modal-box{

  width:min(450px,100%);

  padding:24px;

  background:#11182a;

  border:
    1px solid var(--line);

  border-radius:22px;

  box-shadow:
    0 30px 100px rgba(0,0,0,.5);
}

.modal-box h2{

  margin-bottom:8px;
}

.modal-box p{

  color:var(--muted);

  margin-bottom:18px;
}

.modal-box input{

  width:100%;

  padding:13px;

  margin-bottom:8px;

  background:#080d18;

  color:white;

  border:
    1px solid var(--line);

  border-radius:10px;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:760px){

  .grid{

    grid-template-columns:
      repeat(2,1fr);
  }

  .tool-grid{

    grid-template-columns:1fr;
  }

  .hero{

    padding-top:35px;
  }

}

@media(max-width:500px){

  .topbar{

    padding:
      0 12px;
  }

  .top-actions .btn:first-child{

    display:none;
  }

  .grid{

    grid-template-columns:1fr;
  }

  main{

    padding:
      20px 13px
      70px;
  }

  .hero h1{

    font-size:42px;
  }

  .panel{

    padding:17px;
  }

  .brand-sub{

    display:none;
  }

}

</style>
</head>

function escapeHTML(value){

  return String(value)

    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

    stream:"",
    subject:"",
    book:"",

  };

  render();

  else if(type==="subject"){

    state.subject=value;

    state.book="";
    state.chapter="";

    state.page="book";

  }


  else if(type==="book"){

    state.book=value;

    state.chapter="";

    state.page="chapter";

  }


  else if(type==="chapter"){

    state.chapter=value;

    state.tab="learn";

    state.page="topic";

  }


  render();

}


/* =========================================================
   BACK
   ========================================================= */

function back(){

  if(state.page==="board"){

    state.class="";
    state.page="home";

  }

  else if(state.page==="stream"){

    state.board="";
    state.page="board";

  }

  else if(state.page==="subject"){

    state.stream="";
    state.page="stream";

  }

  else if(state.page==="book"){

    state.subject="";
    state.page="subject";

  }

  else if(state.page==="chapter"){

    state.book="";
    state.page="book";

  }

  else if(state.page==="topic"){

    state.chapter="";
    state.page="chapter";

  }

  else{

    goHome();
    return;

  }

  render();

}


/* =========================================================
   PATH
   ========================================================= */

function getPath(){

  const items=["Home"];

  if(state.class)
    items.push("Class "+state.class);

  if(state.board)
    items.push(state.board);

  if(state.stream)
    items.push(state.stream);

  if(state.subject)
    items.push(state.subject);

  if(state.book)
    items.push(state.book);

  if(state.chapter)
    items.push(state.chapter);


  return `

    <div class="path">

      ${items.map((item,index)=>`

        <span class="${index===items.length-1?'strong':''}">
          ${escapeHTML(item)}
        </span>

        ${index<items.length-1?'<b>›</b>':''}

      `).join("")}

    </div>

  `;

}

/* =========================================================
   QUIZ RESULT
   ========================================================= */

function showQuizResult(index,understood){

  const element =
    document.getElementById(
      "quiz-"+index
    );


  if(!element)
    return;


  if(understood){

    element.className=
      "quiz-result correct";

    element.textContent=
      "Good. Now explain the idea in your own words.";

  }

  else{

    element.className=
      "quiz-result incorrect";

    element.textContent=
      "That's exactly what revision is for. Open LEARN or PRACTICE.";

  }

}

/* =========================================================
   AI
   ========================================================= */

function openAI(){

  if(state.chapter){

    state.tab="ai";

    render();

  }

  else{

    openAccount();

    setTimeout(()=>{

      document.getElementById(
        "modalContent"
      ).innerHTML+=`

        <div class="notice">

          Open a topic first if you want
          topic-specific AI help.

        </div>

      `;

    },10);

  }

}


function askAI(){

  const input =
    document.getElementById(
      "aiQuestion"
    );

  const output =
    document.getElementById(
      "aiResponse"
    );


  if(!input || !output)
    return;


  const question =
    input.value.trim();


  if(!question){

    output.textContent=
      "Write a question first.";

    return;

  }


  if(state.aiQuestions>=3){

    output.textContent=
      "Today's free AI allowance has been used. Come back tomorrow.";

    return;

  }


  state.aiQuestions++;


  output.textContent=

`Demo StudyCore Tutor

Question:
${question}

How the real tutor will answer:

1. Understand what the question is asking.
2. List the information given.
3. Identify what needs to be found.
4. Select the correct concept or formula.
5. Explain why that method applies.
6. Solve step-by-step.
7. Check the final answer.

The AI backend will be connected in the next stage.`;

}

function calculateSpeed(){

    Number(

  const t=
    Number(
      document.getElementById(
        "speedTime"
      ).value
    );


  document.getElementById(
    "speedResult"
  ).textContent=

    t>0

    ? `${d/t} m/s`

    : "Enter a valid time.";

}


function calculateForce(){

  const m=
    Number(
      document.getElementById(
        "forceMass"
      ).value
    );

  const a=
    Number(
      document.getElementById(
        "forceAcceleration"
      ).value
    );


  document.getElementById(
    "forceResult"

function calculateOhm(){

function closeModalOutside(event){

  if(
    event.target.id==="modal"
  ){

    closeModal();

  }

}


function closeModal(){

  document.getElementById(
    "modal"
  ).classList.remove("show");

}


/* =========================================================
   MAIN RENDER
   ========================================================= */

function render(){

  if(state.page==="home"){

    renderHome();
    return;

  }


  if(state.page==="board"){

    renderBoard();
    return;

  }


  if(state.page==="stream"){

    renderStream();
    return;

  }


  if(state.page==="subject"){

    renderSubject();
    return;

  }


  if(state.page==="book"){

    renderBook();
    return;

  }


  if(state.page==="chapter"){

    renderChapter();
    return;

  }


  if(state.page==="topic"){

    renderTopic();
    return;

  }

}


/* =========================================================
   START
   ========================================================= */

render();

</script>

</body>
</html>
